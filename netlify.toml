# ============================================================
# Netlify 部署配置
# ------------------------------------------------------------
# 这个项目是纯静态站：仓库根目录已经有 index.html，
# 所有资源（css/、js/）都是相对路径，不需要任何构建步骤。
#
# 有了这个文件，Netlify 连接仓库时会自动读取下面的设置，
# 不用在网页表单里手填。
# ============================================================

[build]
  # 发布目录 = 仓库根目录
  publish = "."
